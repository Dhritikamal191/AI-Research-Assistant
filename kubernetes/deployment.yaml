apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-research-assistant

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-research-assistant

  template:
    metadata:
      labels:
        app: ai-research-assistant

    spec:
      containers:
         - name: ai-research-assistant
           image: dhritikamal191/ai-research-assistant-api:latest
           imagePullPolicy: Always

           ports:
             - containerPort: 8000

           livenessProbe:
             httpGet:
               path: /health
               port: 8000
             initialDelaySeconds: 30
             periodSeconds: 20

           readinessProbe:
             httpGet:
               path: /health
               port: 8000
             initialDelaySeconds: 10
             periodSeconds: 10

           env:
             - name: GROQ_API_KEY
               valueFrom:
                secretKeyRef:
                  name: ai-research-secrets
                  key: GROQ_API_KEY