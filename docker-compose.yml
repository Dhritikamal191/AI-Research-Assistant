services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-research-assistant-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data/uploads:/app/data/uploads
      - ./vectorstore:/app/vectorstore
      - ./logs:/app/logs
      - ./monitoring:/app/monitoring
      - ./evaluation:/app/evaluation

    restart: unless-stopped